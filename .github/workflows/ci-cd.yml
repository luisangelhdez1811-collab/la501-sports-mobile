# =============================================================================
#  CI/CD - La 501 Sports App Móvil (Expo / React Native)
#
#  - Pruebas:   cada push o Pull Request hacia develop, release o main ejecuta
#               lint, revisión de tipos (TypeScript) y las pruebas unitarias e
#               integración con Jest.
#  - Versión:   en los Pull Request hacia main verifica que la versión de
#               app.json la haya preparado release-please y sea nueva para main.
#  - Construir: con EAS Build (servidores de Expo):
#                 release -> APK de prueba (perfil "preview")
#                 main    -> AAB firmado para Google Play Store (perfil "production")
#               y, si la variable PLAY_SUBMIT = true, EAS Submit lo envía a Google Play.
#  - Publicar:  en main adjunta el .aab al Release vX.Y.Z que creó release-please.
#  - Sincronizar: después de publicar abre el PR release → develop.
#
#  El número de versión, el CHANGELOG y el tag los maneja release-please
#  (.github/workflows/release-please.yml).
#  Secretos: EXPO_TOKEN (compilar y enviar) y RELEASE_TOKEN (release-please y sincronizar).
# =============================================================================
name: CI/CD

on:
  push:
    branches: [develop, release, main]
  pull_request:
    branches: [develop, release, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Detecta el proyecto, lee la versión y revisa si EAS está configurado
  # ---------------------------------------------------------------------------
  verificar:
    name: Verificar proyecto
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.revisar.outputs.app }}
      version: ${{ steps.revisar.outputs.version }}
      eas: ${{ steps.revisar.outputs.eas }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Revisar estructura, versión y credenciales
        id: revisar
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -f package.json ] && [ -f app.json ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            VERSION="$(jq -r '.expo.version // empty' app.json)"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Proyecto pendiente::Todavía no está el proyecto Expo (package.json y app.json). Se omiten pruebas y compilación."
            VERSION="0.0.0"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=app.json::expo.version debe tener formato X.Y.Z (ej. 1.0.0). Valor actual: '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión de la app: $VERSION"

          if [ -n "$EXPO_TOKEN" ]; then
            echo "eas=true" >> "$GITHUB_OUTPUT"
          else
            echo "eas=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Falta EXPO_TOKEN::Agrega el secreto EXPO_TOKEN para que el pipeline pueda compilar el APK/AAB con EAS."
          fi

  # ---------------------------------------------------------------------------
  # 2. En los Pull Request hacia main: la versión la preparó release-please y es
  #    nueva para main (evita llegar a main sin versión o repetir una ya publicada)
  # ---------------------------------------------------------------------------
  version:
    name: Versión
    needs: verificar
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Comprobar la versión
        env:
          VERSION: ${{ needs.verificar.outputs.version }}
        run: |
          git fetch --quiet --depth=1 origin main
          EN_MAIN="$(git show origin/main:app.json 2>/dev/null | jq -r '.expo.version // empty' || true)"
          if [ "$VERSION" = "$EN_MAIN" ]; then
            echo "::error file=app.json::main ya tiene la versión ${VERSION}. Fusiona primero en release el PR de release-please (\"chore: preparar versión …\")."
            exit 1
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null; then
            echo "::error file=app.json::No existe el tag v${VERSION}: esta versión no la preparó release-please. Fusiona su PR en release y vuelve a intentarlo."
            exit 1
          fi
          echo "Versión v${VERSION} preparada por release-please (main tiene ${EN_MAIN:-ninguna})."

  # ---------------------------------------------------------------------------
  # 3. Lint, tipos y pruebas unitarias / de integración
  # ---------------------------------------------------------------------------
  pruebas:
    name: Pruebas
    needs: verificar
    if: needs.verificar.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Instalar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint de Expo)
        run: npx expo lint

      - name: Revisión de tipos (TypeScript)
        run: |
          # expo-env.d.ts lo genera "expo start"; en CI se crea para que tsc conozca los tipos de Expo
          [ -f expo-env.d.ts ] || echo '/// <reference types="expo/types" />' > expo-env.d.ts
          npx tsc --noEmit

      - name: Pruebas unitarias y de integración (Jest)
        run: |
          if ! node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            echo "::error title=Sin pruebas::package.json no tiene el script \"test\". Agrega pruebas con Jest."
            exit 1
          fi
          npm test -- --ci

  # ---------------------------------------------------------------------------
  # 4. Compilación con EAS (release = APK de prueba, main = AAB para Play Store)
  # ---------------------------------------------------------------------------
  construir:
    name: Construir app (EAS)
    needs: [verificar, pruebas]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main') &&
      needs.verificar.outputs.app == 'true' &&
      needs.verificar.outputs.eas == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.verificar.outputs.version }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Instalar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Configurar Expo y EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar en EAS y esperar el resultado
        id: eas
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            PERFIL="production"; EXT="aab"; NOMBRE="la501-sports-mobile-v${VERSION}"
          else
            PERFIL="preview";    EXT="apk"; NOMBRE="la501-sports-mobile-v${VERSION}-rc"
          fi

          eas build --platform android --profile "$PERFIL" --non-interactive --json \
            --message "${GITHUB_REF_NAME} ${GITHUB_SHA::7}" > build.json

          URL="$(jq -r '.[0].artifacts.buildUrl // empty' build.json)"
          if [ -z "$URL" ]; then
            echo "::error::EAS no devolvió el archivo compilado. Revisa el build en https://expo.dev"
            cat build.json
            exit 1
          fi

          mkdir -p dist
          curl -sSfL "$URL" -o "dist/${NOMBRE}.${EXT}"
          ls -lh dist
          echo "nombre=${NOMBRE}" >> "$GITHUB_OUTPUT"
          echo "archivo=dist/${NOMBRE}.${EXT}" >> "$GITHUB_OUTPUT"
          echo "build_id=$(jq -r '.[0].id' build.json)" >> "$GITHUB_OUTPUT"

      # EAS Submit: envía el .aab a Google Play (eas.json → submit.production: prueba
      # cerrada "alpha", en borrador). Se activa creando la variable de Actions
      # PLAY_SUBMIT = true, cuando ya exista la app en Play Console y la llave de la
      # cuenta de servicio de Google esté cargada en EAS (expo.dev → Credentials).
      - name: Enviar a Google Play (EAS Submit)
        if: github.ref == 'refs/heads/main' && vars.PLAY_SUBMIT == 'true'
        env:
          BUILD_ID: ${{ steps.eas.outputs.build_id }}
        run: eas submit --platform android --profile production --non-interactive --id "$BUILD_ID"

      - name: Guardar archivo como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.eas.outputs.nombre }}
          path: ${{ steps.eas.outputs.archivo }}
          retention-days: 30
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 5. Adjuntar el .aab al Release que creó release-please (solo main)
  # ---------------------------------------------------------------------------
  publicar:
    name: Publicar versión estable
    needs: [verificar, construir]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verificar.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Descargar el .aab
        uses: actions/download-artifact@v4
        with:
          name: la501-sports-mobile-v${{ needs.verificar.outputs.version }}
          path: dist

      - name: Adjuntar .aab al Release v${{ needs.verificar.outputs.version }}
        run: |
          ARCHIVO="dist/la501-sports-mobile-v${VERSION}.aab"
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release upload "v${VERSION}" "$ARCHIVO" --clobber
          else
            # Respaldo por si se llegó a main sin release-please: se crea el Release aquí.
            echo "::warning::No existe el Release v${VERSION} de release-please; se crea desde main."
            gh release create "v${VERSION}" "$ARCHIVO" --target "${GITHUB_SHA}" \
              --title "La 501 Sports App v${VERSION}" --generate-notes
          fi

  # ---------------------------------------------------------------------------
  # 6. Sincronizar develop con la versión publicada (solo main)
  # ---------------------------------------------------------------------------
  sincronizar:
    name: Sincronizar develop
    needs: [verificar, publicar]
    # También corre si se omitió la compilación (sin EXPO_TOKEN); no si algo falló.
    if: >-
      !cancelled() && !failure() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verificar.outputs.version }}
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Abrir PR release → develop
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning title=Sincronización pendiente::Falta el secreto RELEASE_TOKEN. Abre a mano el PR release → develop."
            exit 0
          fi
          REPO="${GITHUB_REPOSITORY}"
          PENDIENTES="$(gh api "repos/$REPO/compare/develop...release" --jq '.ahead_by')"
          if [ "${PENDIENTES:-0}" = "0" ]; then
            echo "develop ya tiene todo lo de release."
            exit 0
          fi
          if [ -n "$(gh pr list -R "$REPO" --base develop --head release --state open --json number --jq '.[0].number')" ]; then
            echo "Ya hay un PR release → develop abierto."
            exit 0
          fi
          gh pr create -R "$REPO" --base develop --head release \
            --title "chore: sincronizar develop con la versión ${VERSION} (release → develop)" \
            --body "Sincronización automática después de publicar v${VERSION}: trae a develop el ajuste de versión y el CHANGELOG."
