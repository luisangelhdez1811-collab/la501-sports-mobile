# CP-04: el mesero inicia sesión, ve el mapa de mesas y abre una mesa con sus pestañas
# "Tomar pedido" y "Cuentas". No envía nada a cocina ni cobra.
appId: com.la501.sports
name: CP-04 Mesero - mapa de mesas y cuentas
tags:
  - mesero
---
# El emulador de GitHub Actions es lento y variable: los tiempos de espera tienen margen
# para que una prueba no falle solo porque la app tardó más en abrir.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Cuenta"
    timeout: 90000
- tapOn: "Cuenta"
# El botón queda debajo de la lista de beneficios: en pantallas chicas hay que desplazarse.
- scrollUntilVisible:
    element: "Iniciar sesión"
    direction: DOWN
    timeout: 30000
- tapOn: "Iniciar sesión"
- tapOn: "tu@correo.com"
- inputText: ${MESERO_EMAIL}
- tapOn: "••••••••"
- inputText: ${MESERO_PASSWORD}
- hideKeyboard
- tapOn: "Entrar"
- extendedWaitUntil:
    visible: "Mesas"
    timeout: 30000
- assertVisible: ".*ocupadas.*libres.*"
- tapOn: "Mesa 1,.*"
- extendedWaitUntil:
    visible: "Tomar pedido"
    timeout: 30000
- assertVisible: "Pidiendo: .*"
- tapOn: "Buscar platillo o bebida"
- inputText: "agua"
- assertVisible: "Agua.*"
- tapOn: "Cuentas.*"
- takeScreenshot: CP-04-cuentas
